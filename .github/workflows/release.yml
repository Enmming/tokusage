name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-14
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04
          - target: x86_64-pc-windows-msvc
            os: windows-2022

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install cross (Linux musl targets)
        if: contains(matrix.target, 'musl')
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == *musl* ]]; then
            cross build --release --target ${{ matrix.target }} --bin tokusage
          else
            cargo build --release --target ${{ matrix.target }} --bin tokusage
          fi

      - name: Package (Unix)
        if: ${{ !contains(matrix.target, 'windows') }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          STAGE="tokusage-${VERSION}-${{ matrix.target }}"
          mkdir "$STAGE"
          cp "target/${{ matrix.target }}/release/tokusage" "$STAGE/"
          cp README.md LICENSE "$STAGE/" 2>/dev/null || true
          tar czf "${STAGE}.tar.gz" "$STAGE"
          if command -v shasum >/dev/null; then
            shasum -a 256 "${STAGE}.tar.gz" > "${STAGE}.tar.gz.sha256"
          else
            sha256sum "${STAGE}.tar.gz" > "${STAGE}.tar.gz.sha256"
          fi

      # Windows ships a .zip (double-click friendly) instead of .tar.gz.
      - name: Package (Windows)
        if: ${{ contains(matrix.target, 'windows') }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $stage = "tokusage-${env:GITHUB_REF_NAME}-${{ matrix.target }}"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/tokusage.exe" "$stage/"
          Copy-Item README.md, LICENSE "$stage/" -ErrorAction SilentlyContinue
          Compress-Archive -Path $stage -DestinationPath "$stage.zip" -Force
          $hash = (Get-FileHash "$stage.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $stage.zip" | Out-File -Encoding ascii "$stage.zip.sha256"

      - uses: actions/upload-artifact@v6
        with:
          name: tokusage-${{ matrix.target }}
          path: |
            tokusage-*.tar.gz
            tokusage-*.tar.gz.sha256
            tokusage-*.zip
            tokusage-*.zip.sha256
          if-no-files-found: ignore

  release:
    name: release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.tar.gz.sha256
            artifacts/*.zip
            artifacts/*.zip.sha256
            scripts/install.sh
          generate_release_notes: true
          fail_on_unmatched_files: true
